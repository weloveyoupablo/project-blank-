<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>PNGEA Recovery</title>
<style>
html,body{margin:0;min-height:100%;background:#050505;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{text-align:center;max-width:320px}.mark{font-weight:900;letter-spacing:2px;font-size:12px;color:#777}.spin{width:24px;height:24px;border:2px solid #333;border-top-color:#eee;border-radius:50%;margin:18px auto;animation:s 1s linear infinite}p{font-size:13px;line-height:1.5;color:#999}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="box"><div class="mark">PNGEA</div><div class="spin"></div><p id="status">Clearing the old app cache…</p></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    try{localStorage.removeItem('pngea:apiBase')}catch{}
    status.textContent='Cache cleared. Reopening PNGEA…';
  }catch(e){
    status.textContent='Recovery finished. Reopening PNGEA…';
  }
  setTimeout(()=>location.replace('./?recovered='+Date.now()),500);
})();
</script>
</body>
</html>
